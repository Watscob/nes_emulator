<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
        body {
          margin: 0;
          padding: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
        }
        #canvas {
          width: 320px;
          height: 320px;
          border: 1px solid black;
        }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <input type="file" id="romFile" accept=".nes,.rom"/>
    <button onclick="loadRomFromFile()">Load ROM</button>
    <button onclick="startEmulator()">Run</button>
    <script src="build/src/nesemulator.js"></script>
    <script src="app.js"></script>
  </body>
</html>
